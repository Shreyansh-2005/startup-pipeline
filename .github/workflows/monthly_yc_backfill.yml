name: Monthly YC India Backfill
on:
  schedule:
    - cron: '0 3 1 * *'   # 3:00 AM UTC on the 1st of every month
  workflow_dispatch:        # lets you trigger it manually too, anytime
jobs:
  run-yc-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run YC backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node yc-backfill.cjs
